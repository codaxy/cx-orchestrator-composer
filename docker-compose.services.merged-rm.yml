# Opt-in override: run the merged Resource Management image in place of SCM, SIM, SOM and SOE.
#
# No consumer reconfiguration. Every consumer addresses those four by Docker DNS name, and the
# merged image serves exactly the same paths on the same ports, so one container claims all
# four names as network aliases and the four individual services are parked behind a profile.
# That is outcome 10: switching means pointing the names at the one image, nothing else.
#
#   docker compose -f docker-compose.yml ... -f docker-compose.services.merged-rm.yml up -d
#
# Each module keeps its own database. Four of the 58 SM tables share a name across modules
# (related_party, note), so a single database fails to migrate — see
# docs/unification/PLAN.md.

services:
  # A service carrying a profile does not start unless that profile is requested, and nothing
  # in the stack depends_on these four, so nothing waits on them.
  resourcecatalogmanagement:
    profiles: ["replaced-by-merged-rm"]
  resourceinventorymanagement:
    profiles: ["replaced-by-merged-rm"]
  resourceordermanagement:
    profiles: ["replaced-by-merged-rm"]
  resourceorderingengine:
    profiles: ["replaced-by-merged-rm"]
  resourcepoolmanagement:
    profiles: ["replaced-by-merged-rm"]

  resourcemanagement:
    container_name: ${CONTAINER_PREFIX:-}cxo-resource-management
    image: ${CXO_IMG_BASE_URL:-ghcr.io/codaxy}/cxo-resource-management:${CXO_RESOURCE_MANAGEMENT_TAG:-${CXO_TAG:-latest}}
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    restart: unless-stopped
    secrets:
      - source: resource-management-appsettings
        target: /app/appsettings-mounted/0/appsettings.json
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      # The published ports the four services used, all onto the one container. 8090 is h2c
      # for the ServiceWorkflows gRPC contract the admin portal speaks.
      - "40634:8080" # was resource catalog management
      - "40639:8080" # was resource inventory management
      - "40652:8080" # was resource order management
      - "40223:8080" # was resource ordering engine, http
      - "50223:8090" # was resource ordering engine, h2c gRPC
      - "40685:8080" # was resource pool management
    healthcheck:
      test: ["CMD", "curl", "-sS", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      cxo_network:
        aliases:
          - cxo-resource-management
          - cxo-resource-catalog-management
          - cxo-resource-inventory-management
          - cxo-resource-order-management
          - cxo-resource-ordering-engine
          - cxo-resource-pool-management

  # The resource manager portal depends_on resourceinventorymanagement, which this override
  # parks. A profiled service cannot be depended on by a non-profiled one, so the dependency
  # is repointed at the merged image. Service Management needed no equivalent — nothing in the
  # stack depends_on those four.
  resourcemanager:
    # !override, not a plain map: Compose MERGES depends_on by key, so without it the parked
    # resourceinventorymanagement entry survives and the project fails to resolve.
    depends_on: !override
      resourcemanagement:
        condition: service_healthy

secrets:
  resource-management-appsettings:
    file: settings/local/appsettings.ResourceManagement.json
