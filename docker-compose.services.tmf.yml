# Partial docker-compose file, cannot be used on its own
services:
  partymanagement:
    container_name: ${CONTAINER_PREFIX:-}cxo-party-management
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
    image: ${CXO_IMG_BASE_URL:-ghcr.io/codaxy}/cxo-party-management:${CXO_PARTY_MANAGEMENT_TAG:-${CXO_TAG:-latest}}

    ports:
      - "40632:8080"
    restart: unless-stopped
    secrets:
      - source: party-management-appsettings
        target: /app/appsettings-mounted/0/appsettings.json
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-sS",
          "--fail",
          "http://localhost:8080/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      cxo_network:
        aliases:
          - cxo-party-management

