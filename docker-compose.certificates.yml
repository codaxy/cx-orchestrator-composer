# Compose project name, fixed so the stack's volumes and containers keep their names whatever
# this folder is called. Volume names start with it: changing it gives an existing installation
# new, empty volumes. COMPOSE_PROJECT_NAME (e.g. in .env) still takes precedence.
name: cxo-composer

services:
  certgenerator:
    container_name: ${CONTAINER_PREFIX:-}cxo-certgenerator
    build:
      context: .
      dockerfile: dockerfiles/certgen/Dockerfile
    volumes:
      - ./certs/:/certs
