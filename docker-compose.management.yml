include: 
  - ./docker-compose.network.yml

services:
  portainer:
    image: ${HL_INFRA_IMG_BASE_URL:-docker.io/portainer}/portainer-ce:2.36.0
    container_name: ${CONTAINER_PREFIX:-}cxo-portainer
    restart: unless-stopped
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
      - "9443:9443"
    networks:
      cxo_network:
        aliases:
          - cxo-portainer

  autoheal:
    image: ${HL_INFRA_IMG_BASE_URL:-docker.io/willfarrell}/autoheal:1.2.0
    container_name: ${CONTAINER_PREFIX:-}cxo-autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      cxo_network:
        aliases:
          - cxo-autoheal

volumes:
  portainer_data: null
