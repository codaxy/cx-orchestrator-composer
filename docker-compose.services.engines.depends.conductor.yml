# Engines that wait on the orchestration engine, for conductor. Passed with -f by
# startup.sh; see README, "Start the stack", for why this is not an include.

services:
  serviceorderingengine:
    depends_on:
      conductor:
        condition: service_healthy

  serviceactivationmanagement:
    depends_on:
      conductor:
        condition: service_healthy

  resourceorderingengine:
    depends_on:
      conductor:
        condition: service_healthy
