[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432

auth_type = scram-sha-256
auth_query = SELECT * FROM public.get_pg_shadow_pass($1::text);

# admin_users = postgres

max_client_conn = 4000
# This is a dangerous setting, see more at https://www.pgbouncer.org/config.html and https://www.pgbouncer.org/features.html
pool_mode = transaction

# Pool defaults (Tier 3)
default_pool_size = 3
min_pool_size = 1

# Reserve pool for bursts
reserve_pool_size = 80
reserve_pool_timeout = 5

# Global backend connection caps
max_db_connections = 300
max_user_connections = 300

# Since connections are reused, this is to avoid issues stemming from clients sending queries like `SET statement_timeout = '5min'` which will affect the entire connection
server_reset_query = DISCARD ALL
server_reset_query_always = 1

# Query timeout (30 seconds) - can be overridden per database
query_timeout = 30

ignore_startup_parameters = extra_float_digits

[databases]

# TIER 1 — HIGHEST LOAD (pool_size = 30)
# Priority databases: inventory + orders
service_inventory_management = host=cxo-db-postgres port=5432 dbname=service_inventory_management auth_user=pgbouncer pool_size=20
resource_inventory_management = host=cxo-db-postgres port=5432 dbname=resource_inventory_management auth_user=pgbouncer pool_size=20

service_order_management = host=cxo-db-postgres port=5432 dbname=service_order_management auth_user=pgbouncer pool_size=20
resource_order_management = host=cxo-db-postgres port=5432 dbname=resource_order_management auth_user=pgbouncer pool_size=20

# TIER 2 — MEDIUM LOAD (pool_size = 8)
# All databases with normal traffic patterns
admin_portal = host=cxo-db-postgres port=5432 dbname=admin_portal auth_user=pgbouncer pool_size=8
audit = host=cxo-db-postgres port=5432 dbname=audit auth_user=pgbouncer pool_size=8
event_management = host=cxo-db-postgres port=5432 dbname=event_management auth_user=pgbouncer pool_size=8
geographic_address_management = host=cxo-db-postgres port=5432 dbname=geographic_address_management auth_user=pgbouncer pool_size=8
geographic_location_management = host=cxo-db-postgres port=5432 dbname=geographic_location_management auth_user=pgbouncer pool_size=8
geographic_site_management = host=cxo-db-postgres port=5432 dbname=geographic_site_management auth_user=pgbouncer pool_size=8

resource_catalog_management = host=cxo-db-postgres port=5432 dbname=resource_catalog_management auth_user=pgbouncer pool_size=8
resource_ordering_engine = host=cxo-db-postgres port=5432 dbname=resource_ordering_engine auth_user=pgbouncer pool_size=8
resource_pool_management = host=cxo-db-postgres port=5432 dbname=resource_pool_management auth_user=pgbouncer pool_size=8

service_catalog_management = host=cxo-db-postgres port=5432 dbname=service_catalog_management auth_user=pgbouncer pool_size=8
service_ordering_engine = host=cxo-db-postgres port=5432 dbname=service_ordering_engine auth_user=pgbouncer pool_size=8
service_activation_management = host=cxo-db-postgres port=5432 dbname=service_activation_management auth_user=pgbouncer pool_size=8

# TIER 3 — LOW LOAD (uses default_pool_size = 3)
customer_management = host=cxo-db-postgres port=5432 dbname=customer_management auth_user=pgbouncer
cxo_settings = host=cxo-db-postgres port=5432 dbname=cxo_settings auth_user=pgbouncer
digital_identity = host=cxo-db-postgres port=5432 dbname=digital_identity auth_user=pgbouncer
locking_management = host=cxo-db-postgres port=5432 dbname=locking_management auth_user=pgbouncer
party_management = host=cxo-db-postgres port=5432 dbname=party_management auth_user=pgbouncer
party_role_management = host=cxo-db-postgres port=5432 dbname=party_role_management auth_user=pgbouncer
user_roles_and_permissions = host=cxo-db-postgres port=5432 dbname=user_roles_and_permissions auth_user=pgbouncer

# Wildcard mapping for Tier 3 and any future DBs
* = host=cxo-db-postgres port=5432 auth_user=pgbouncer

# -----------------------------------------------------------------------------
# Total backend connections calculation (for reference)
# -----------------------------------------------------------------------------
# Tier 1 — High Load (4 DBs × 20) = 80
# Tier 2 — Medium Load (10 DBs × 8) = 80
# Tier 3 — Low Load (7 DBs × 3 default) = 21
# Reserve Pool = 87
# ------------------------
# Total maximum backend connections = 80 + 80 + 21 + 87 = 268