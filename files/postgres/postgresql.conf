# Connection Settings
max_connections = 300          # matches PgBouncer backend cap

# Memory Settings (Tuned for an 8GB system)
shared_buffers = 2GB           # ~25% of RAM
work_mem = 8MB                 # per connection, adjust for complex queries
maintenance_work_mem = 256MB   # for VACUUM, CREATE INDEX, etc.
effective_cache_size = 6GB     # for planner, ~75% of RAM

# Parallelism / Workers
max_worker_processes = 8
max_parallel_workers = 8
max_parallel_workers_per_gather = 4

# Locks / Transactions
max_locks_per_transaction = 256
max_pred_locks_per_transaction = 256

# Query Timeouts
statement_timeout = 30s              # Maximum duration of any statement (30 seconds)
lock_timeout = 30s                  # Maximum time to wait for a lock (30 seconds)
idle_in_transaction_session_timeout = 5min

# Autovacuum / Maintenance
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_scale_factor = 0.2
autovacuum_analyze_scale_factor = 0.1

# Checkpoints
checkpoint_completion_target = 0.7
checkpoint_timeout = 15min
max_wal_size = 2GB
min_wal_size = 1GB

# Misc
listen_addresses = '*'
