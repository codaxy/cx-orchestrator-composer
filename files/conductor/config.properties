# Servers.
conductor.grpc-server.enabled=true
conductor.app.ownerEmailMandatory=false

# Database persistence type.
conductor.db.type=postgres
# conductor.queue.type=postgres

conductor.queue.type=redis_standalone

conductor.redis.hosts=cxo-redis:6379:us-east-1c
conductor.redis-lock.serverAddress=redis://cxo-redis:6379
conductor.redis.taskDefCacheRefreshInterval=1
conductor.redis.workflowNamespacePrefix=conductor
conductor.redis.queueNamespacePrefix=conductor_queues

spring.datasource.url=jdbc:postgresql://cxo-conductordb:5432/?currentSchema=public&ApplicationName=conductor
spring.datasource.username=postgres
spring.datasource.password=postgres

# Hikari pool sizes are -1 by default and prevent startup
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Load sample kitchen sink workflow
loadSample=false

# Custom changes
conductor.indexing.enabled=true
conductor.indexing.type=postgres
conductor.elasticsearch.version=0

# External payload storage
conductor.external-payload-storage.type=postgres
conductor.external-payload-storage.postgres.username=postgres
conductor.external-payload-storage.postgres.password=postgres
conductor.external-payload-storage.postgres.url=jdbc:postgresql://cxo-conductordb:5432/

# Maximum count of days of data age in PostgreSQL database. After overcoming limit, the oldest data will be deleted.
conductor.external-payload-storage.postgres.maxDataDays=7

# URL, that can be used to pull the json configurations, that will be downloaded from PostgreSQL to the conductor server. For example: for local development it is "http://localhost:8080"
conductor.external-payload-storage.postgres.conductorUrl=http://localhost:8080


