# Kafka messaging
conductor.message-publisher.type=kafka
conductor.workflow-status-listener.type=kafka
conductor.task-status-listener.type=kafka
conductor.message-publisher.kafka.bootstrapServers=cxo-kafka:9092
conductor.message-publisher.kafka.taskStatusTopic=conductor.status.task
conductor.message-publisher.kafka.workflowStatusTopic=conductor.status.workflow
conductor.message-publisher.kafka.alwaysPublishWorkflowStatusEnabled=true
conductor.message-publisher.kafka.allowedTaskStatuses=COMPLETED,COMPLETED_WITH_ERRORS,IN_PROGRESS,FAILED,CANCELED,TIMED_OUT

# Task statuses
# IN_PROGRESS,CANCELED,FAILED,FAILED_WITH_TERMINAL_ERROR,COMPLETED,COMPLETED_WITH_ERRORS,SCHEDULED,TIMED_OUT,SKIPPED

# CxO does not use Conductor's AI integrations (on by default in upstream 3.32.5). Off keeps the server
# stock and avoids two @Primary status listeners (agentspan composite vs our Kafka publisher).
conductor.integrations.ai.enabled=false

# Custom
# This helps with slow joins
conductor.app.systemTaskWorkerCallbackDuration=1s

# This *might* help further with slow joins
conductor.app.systemTaskWorkerPollInterval=1s

# This helps with long delays between scheduling and execution of concurrent tasks
# when concurrency limits are set. The default is apparently 60s, which is way too long for us
conductor.app.taskExecutionPostponeDuration=1s
