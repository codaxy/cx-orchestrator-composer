auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Log retention — typical operational targets:
#   Non-PROD: 7-14 days
#   PROD:     30 days (720h)
# Current default 168h (7d) is the lower bound of Non-PROD. Override per
# environment via a Loki config overlay before deployment.
# Bumping retention requires sizing the chunks volume — Loki stores roughly
# 500 B per log line on disk after compression.
limits_config:
  retention_period: 168h

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  delete_request_cancel_period: 10m
  delete_request_store: filesystem
