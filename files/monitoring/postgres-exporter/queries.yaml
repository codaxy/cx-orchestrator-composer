pg_custom_connections:
  query: |
    SELECT
      datname AS database,
      count(*) FILTER (WHERE state = 'active')           AS active,
      count(*) FILTER (WHERE state = 'idle')             AS idle,
      count(*) FILTER (WHERE state = 'idle in transaction') AS idle_in_transaction,
      count(*)                                           AS total,
      (SELECT setting::int FROM pg_settings WHERE name = 'max_connections') AS max_connections,
      100.0 * count(*) / NULLIF((SELECT setting::int FROM pg_settings WHERE name = 'max_connections'), 0) AS used_pct
    FROM pg_stat_activity
    WHERE datname IS NOT NULL
    GROUP BY datname
  metrics:
    - database:
        usage: LABEL
        description: Database name
    - active:
        usage: GAUGE
        description: Active connections
    - idle:
        usage: GAUGE
        description: Idle connections
    - idle_in_transaction:
        usage: GAUGE
        description: Idle-in-transaction connections
    - total:
        usage: GAUGE
        description: Total connections (all states)
    - max_connections:
        usage: GAUGE
        description: Server max_connections setting
    - used_pct:
        usage: GAUGE
        description: Percent of max_connections in use by this database

pg_custom_longest_query:
  query: |
    SELECT
      datname AS database,
      COALESCE(EXTRACT(EPOCH FROM (now() - query_start)), 0)::float AS seconds
    FROM pg_stat_activity
    WHERE state = 'active'
      AND query_start IS NOT NULL
      AND query NOT ILIKE '%pg_stat_activity%'
    ORDER BY seconds DESC
    LIMIT 1
  metrics:
    - database:
        usage: LABEL
        description: Database with the longest currently running query
    - seconds:
        usage: GAUGE
        description: Duration of the longest running query in seconds

pg_custom_database_size:
  query: |
    SELECT
      datname AS database,
      pg_database_size(datname)::bigint AS bytes
    FROM pg_database
    WHERE datname NOT IN ('template0', 'template1')
  metrics:
    - database:
        usage: LABEL
        description: Database name
    - bytes:
        usage: GAUGE
        description: Database size in bytes
